apiVersion: v1
kind: Service
metadata:
  name: source-nginx
spec:
 selector:
   name: srikanth
   from: kurnool
   course: devops
 ports:
 - protocol: TCP
   port: 80
   targetPort: 80

---
apiVersion: v1
kind: Pod
metadata:
 name: nginx-sk 
 labels:
   name: srikanth
   from: kurnool
   course: devops
spec:
 containers:
  - name: nginx
    image: nginx

